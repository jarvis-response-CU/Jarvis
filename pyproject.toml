[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Centralized information layer for emergency response"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-serve = "jarvis.server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
