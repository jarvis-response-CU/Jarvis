# References:
#   https://fly.io/docs/reference/configuration/

app = "jarvis-boulder"
primary_region = "dfw"

[http_service]
  internal_port = 8080
  force_https = true
  # Machines stop when nobody's using the site and start on the next visit.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# An earthquake run holds every NSI building in its footprint in memory;
# 1 GB ran out on a magnitude 5 in Los Angeles.
[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
