# References:
#   https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
#   https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions

# Loads spreadsheets from data/inbox/ and catalogs data/library/ in the database
# (see the README.md in each folder).
name: Load inbox into database

on:
  push:
    branches: [main]
    paths: ["data/inbox/**", "data/library/**"]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab
  # Free Supabase projects pause after a week without activity; a weekly
  # reload counts as activity and is harmless because loads never duplicate rows.
  schedule:
    - cron: "0 15 * * 1" # Mondays, 15:00 UTC

# Two uploads close together run one after the other instead of at the same time.
concurrency:
  group: load-inbox
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m jarvis.inbox
        env:
          JARVIS_DATABASE_URL: ${{ secrets.JARVIS_DATABASE_URL }}
